<!-- The real band, reduced, with the source's own naming replaced. A contact form whose fields are
     followed by a CHIP GROUP -- a label beside three `type="button"` toggles, the chosen one filled --
     and only then by the real `type="submit"`. -->
<html><head><title>Northgate Chambers</title></head><body>
<section data-sc-cs="background-color:rgb(245, 179, 1);padding:96px 80px;display:block">
  <form class="space-y-6" data-sc-cs="display:block;width:552px">
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6" data-sc-cs="display:grid;gap:24px;grid-template-columns:264px 264px">
      <div data-sc-cs="display:block">
        <label for="fn" data-sc-cs="font-size:12px;font-weight:700;text-transform:uppercase;display:block">Full Name *</label>
        <input id="fn" type="text" required placeholder="e.g. Eleanor Vance" class="w-full bg-transparent border-b-2" data-sc-cs="color:rgb(0, 0, 0);font-size:15px;padding:8px 0px;width:264px">
      </div>
      <div data-sc-cs="display:block">
        <label for="em" data-sc-cs="font-size:12px;font-weight:700;text-transform:uppercase;display:block">Email Address *</label>
        <input id="em" type="email" required placeholder="e.g. e.vance@company.com" class="w-full bg-transparent border-b-2" data-sc-cs="color:rgb(0, 0, 0);font-size:15px;padding:8px 0px;width:264px">
      </div>
    </div>
    <div data-sc-cs="display:block">
      <label for="msg" data-sc-cs="font-size:12px;font-weight:700;text-transform:uppercase;display:block">Tell us about your matter</label>
      <textarea id="msg" rows="4" placeholder="Briefly describe the nature of the dispute..." class="w-full bg-transparent border-b-2 resize-none" data-sc-cs="color:rgb(0, 0, 0);font-size:15px;padding:8px 0px;width:552px"></textarea>
    </div>
    <div class="flex items-center justify-between pt-2" data-sc-cs="display:flex;flex-direction:row;justify-content:space-between;align-items:center;padding:8px 0px 0px">
      <span class="text-[12px] font-bold uppercase tracking-wider text-black" data-sc-cs="color:rgb(0, 0, 0);font-size:12px;font-weight:700;text-transform:uppercase;display:block">Matter Urgency:</span>
      <div class="flex items-center gap-3" data-sc-cs="display:flex;flex-direction:row;align-items:center;column-gap:12px">
        <button type="button" class="bg-black text-white border-black" data-sc-cs="background-color:rgb(0, 0, 0);color:rgb(255, 255, 255);font-size:11px;padding:6px 12px">Standard</button>
        <button type="button" class="bg-transparent text-black border-black/40" data-sc-cs="color:rgb(0, 0, 0);font-size:11px;padding:6px 12px">Urgent (Trial / Injunction)</button>
        <button type="button" class="bg-transparent text-black border-black/40" data-sc-cs="color:rgb(0, 0, 0);font-size:11px;padding:6px 12px">Cross-Border Arbitration</button>
      </div>
    </div>
    <div class="pt-4" data-sc-cs="display:block;padding:16px 0px 0px">
      <button type="submit" class="w-full sm:w-auto inline-flex items-center justify-center gap-4 bg-black text-white px-9 py-4 uppercase" data-sc-cs="background-color:rgb(0, 0, 0);color:rgb(255, 255, 255);font-size:13px;font-weight:700;letter-spacing:1.82px;text-transform:uppercase;padding:16px 36px;width:552px">
        <span data-sc-cs="display:inline">SUBMIT CONFIDENTIALLY</span>
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 7h10v10"></path><path d="M7 17 17 7"></path></svg>
      </button>
    </div>
  </form>
</section>
</body></html>
